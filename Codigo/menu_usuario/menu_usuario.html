<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu de usuario</title>
    <link rel="stylesheet" href="menu_usuario.css">
</head>
<body>
    <header class="header">

        <div class="titulo-header">
            <h1>Universidad San Juan de la Cruz</h1>
            <p>Control de activos</p>
        </div>

        <div class="usuario-header">
            <span>Usuario</span>
            <div class="separador"></div>
            <button class="cerrar-sesion" type="button" onclick="window.location.href='../seleccion_inicio/seleccion_inicio.html'">
                <img
                    src="../seleccion_inicio/img/cerrar_sesion.png"
                    class="icono-salir"
                    alt="Cerrar sesión">
                  Cerrar sesión
            </button>
        </div>
    </header>
    <main class="contenido">
        <div class="parte-superior">
            <div class="informacion">
                <h2>Mis activos</h2>
                <p>
                    Consulta los activos que tienes asignados.
                </p>
            </div>

            <button class="boton-escanear" type="button">
                <img
                    src="../seleccion_inicio/img/scanner.png"
                    class="icono-escaner"
                    alt="Escanear código">
                Escanear Código
            </button>
        </div>
    </main>
</body>
</html>
